name: Validate (Pull Request)

# Runs on every PR to main. Independent validation jobs in parallel:
#   - terraform-plan       : init, validate, plan against current main state
#   - dacpac-build         : build both .sqlproj into .dacpac artifacts
#   - dacpac-deploy-test   : publish both dacpacs onto an ephemeral
#                            SQL Server in docker-in-docker (dind)
#   - docker-build         : build the claw-mock container image (no push)
# None of these jobs change anything in Azure or the cluster.

on:
  pull_request:
    branches:
      - main
  # Intentionally NO `paths:` filter here. Required status checks on
  # the main ruleset wait forever for path-filtered workflows that
  # don't run; always running the jobs is cheaper than a stuck PR.

env:
  REGISTRY: clwmockdevdev1.azurecr.io
  IMAGE_NAME: openclaw/claw-mock

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read TERRAFORM_VERSION from /VERSIONS
        id: tfver
        run: |
          echo "version=$(grep '^TERRAFORM_VERSION=' VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: true

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure backend state container exists
        # The azurerm backend does not create its own container.
        # Idempotent — no-op once `claw-mock` exists on mytofustates.
        run: |
          az storage container create \
            --name claw-mock \
            --account-name mytofustates \
            --auth-mode login \
            --output none || echo "container already exists (or is being created concurrently) — continuing"

      - name: Get AKS credentials for kubernetes/helm providers
        # On a fresh environment the cluster does not exist yet — fall
        # back to a placeholder kubeconfig so the kubernetes/helm
        # providers can still load during `terraform plan` (plan makes
        # no K8s API calls for the resources in this config).
        run: |
          if az aks show --resource-group claw-mock-dev --name claw-mock-aks -o none 2>/dev/null; then
            az aks get-credentials \
              --resource-group claw-mock-dev \
              --name claw-mock-aks \
              --file /tmp/kubeconfig_clawmock \
              --admin
          else
            echo "::notice::AKS cluster claw-mock-aks does not exist yet — using placeholder kubeconfig for plan"
            cat > /tmp/kubeconfig_clawmock <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster: { server: "https://127.0.0.1:6443", insecure-skip-tls-verify: true }
            name: placeholder
          contexts:
          - context: { cluster: placeholder, user: placeholder }
            name: placeholder
          current-context: placeholder
          users:
          - name: placeholder
            user: { token: placeholder }
          EOF
          fi

      - name: Set Terraform environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_AZUREAD_AUTH=true" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=terraform" \
            -backend-config="storage_account_name=mytofustates" \
            -backend-config="container_name=claw-mock" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 7

      - name: Plan Summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          terraform show --json tfplan 2>/dev/null | \
            jq -r '[
              (.resources | length) as $total |
              "### Resources: \($total)",
              "",
              (.resource_changes | group_by(.type) | map("\(.[0].type): \(length)") | join("\n"))
            ] | join("\n")' >> $GITHUB_STEP_SUMMARY || true

      - name: Azure logout
        if: always()
        run: |
          az logout
          rm -rf ~/.azure 2>/dev/null || true

  dacpac-build:
    name: Dacpac Build (AdventureWorks + Northwind)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build AdventureWorks dacpac
        run: dotnet build database/AdventureWorks/AdventureWorks.sqlproj -c Release

      - name: Build Northwind dacpac
        run: dotnet build database/Northwind/Northwind.sqlproj -c Release

      - name: Stage dacpacs
        # MSBuild.Sdk.SqlProj emits into bin/<Config>/<TargetFramework>/,
        # not bin/<Config>/. Stage into a flat dir so the artifact holds
        # the two dacpacs at its root.
        run: |
          mkdir -p artifacts/dacpacs
          cp database/AdventureWorks/bin/Release/net8.0/AdventureWorks.dacpac artifacts/dacpacs/
          cp database/Northwind/bin/Release/net8.0/Northwind.dacpac artifacts/dacpacs/

      - name: Upload dacpac artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dacpacs
          path: artifacts/dacpacs
          if-no-files-found: error
          retention-days: 7

  dacpac-deploy-test:
    # Sample dacpac deploy against an ephemeral SQL Server that lives
    # only inside this job, via docker-in-docker (dind). Proves the
    # dacpacs actually publish — schema, FKs and the post-deployment
    # seed script — before anything is merged.
    #
    # (The issue text says "mysql db" — a dacpac only targets SQL
    # Server, so the dind container is mcr.microsoft.com/mssql/server.)
    name: Dacpac Deploy Test (ephemeral SQL Server via dind)
    needs: dacpac-build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
          - 1433:1433
        options: --privileged

    env:
      DOCKER_HOST: tcp://localhost:2375
      SA_PASSWORD: DindTest!Pw0rd42

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download dacpac artifacts
        uses: actions/download-artifact@v6
        with:
          name: dacpacs
          path: /tmp/dacpacs

      - name: Install sqlpackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Wait for dind daemon
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 2
          done
          docker info >/dev/null

      - name: Pull SQL Server image (with retries)
        # dind starts with an empty image store every run; MCR pulls can
        # flake, so retry instead of letting one transient error kill the job.
        run: |
          ok=false
          for i in 1 2 3; do
            if docker pull mcr.microsoft.com/mssql/server:2022-latest; then
              ok=true; break
            fi
            echo "::warning::docker pull attempt $i failed — retrying"
            sleep 5
          done
          [ "$ok" = true ] || { echo "::error::could not pull mssql image after 3 attempts"; exit 1; }

      - name: Start ephemeral SQL Server
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          docker ps -a

      - name: Wait for SQL Server to accept connections
        # Readiness signal = "Recovery is complete" in the server log AND
        # TCP 1433 reachable from the runner — the same path sqlpackage
        # uses (runner -> dind port mapping -> container). This is
        # deliberately NOT `docker exec ... sqlcmd`: the bundled sqlcmd's
        # path/presence varies between mssql image revisions, which made
        # the previous loop fail even when the server was healthy.
        run: |
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Status}}' mssql 2>/dev/null || echo "missing")
            if [ "$status" = "exited" ] || [ "$status" = "dead" ] || [ "$status" = "missing" ]; then
              echo "::error::SQL Server container is $status — cannot recover"
              docker logs mssql 2>&1 | tail -80
              exit 1
            fi
            if docker logs mssql 2>&1 | grep -q "Recovery is complete" \
               && (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server is up (recovery complete, port 1433 reachable from runner)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::SQL Server did not come up in time"
          docker ps -a
          docker logs mssql 2>&1 | tail -80
          exit 1

      - name: Locate sqlcmd inside the container
        # mssql image revisions have shipped sqlcmd at different paths;
        # discover it once and reuse via $SQLCMD.
        run: |
          for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
            if docker exec mssql test -x "$p"; then
              echo "SQLCMD=$p" >> $GITHUB_ENV
              echo "sqlcmd found at $p"
              exit 0
            fi
          done
          echo "::error::sqlcmd not found in the mssql container"
          docker exec mssql ls -R /opt 2>/dev/null | head -40 || true
          exit 1

      - name: Create empty target databases
        run: |
          docker exec mssql "$SQLCMD" \
            -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 15 \
            -Q "CREATE DATABASE [AdventureWorks]; CREATE DATABASE [Northwind];"

      # The dacpacs target SqlAzure (the real deploy target is Azure SQL);
      # the dind container is on-prem SQL Server 2022. DacFx refuses that
      # cross-platform publish unless AllowIncompatiblePlatform is set —
      # this only relaxes the *engine* check inside the ephemeral test, the
      # dacpac still deploys its full schema + seed script, which is the gate.
      #
      # TrustServerCertificate is a *connection-string* setting, not a
      # DacFx publish property: sqlpackage 170 aborts instantly with
      # "'TrustServerCertificate' is not a valid argument" when passed as
      # /p:. It must go inside /tcs: (the container uses a self-signed
      # cert, and Microsoft.Data.SqlClient defaults to Encrypt=True).
      - name: Publish AdventureWorks dacpac
        run: |
          ls -la /tmp/dacpacs
          command -v sqlpackage
          if ! sqlpackage /a:Publish \
            /sf:/tmp/dacpacs/AdventureWorks.dacpac \
            /tcs:"Server=localhost,1433;Initial Catalog=AdventureWorks;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True" \
            /p:AllowIncompatiblePlatform=True; then
            echo "::error::AdventureWorks dacpac publish failed — last mssql log lines:"
            docker logs mssql 2>&1 | tail -40
            exit 1
          fi

      - name: Publish Northwind dacpac
        run: |
          if ! sqlpackage /a:Publish \
            /sf:/tmp/dacpacs/Northwind.dacpac \
            /tcs:"Server=localhost,1433;Initial Catalog=Northwind;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True" \
            /p:AllowIncompatiblePlatform=True; then
            echo "::error::Northwind dacpac publish failed — last mssql log lines:"
            docker logs mssql 2>&1 | tail -40
            exit 1
          fi

      # The dacpacs are schema only — seeding is no longer a PostDeploy item
      # inside the package, it is /seed/<db>.sql applied by the deploy
      # pipeline to an empty database. Apply them here too, otherwise the
      # seed SQL would never be executed anywhere in PR validation.
      - name: Apply seed scripts
        run: |
          set -euo pipefail
          for DB in AdventureWorks Northwind; do
            echo "::group::Seeding $DB"
            docker cp "seed/${DB}.sql" "mssql:/tmp/${DB}-seed.sql"
            if ! docker exec mssql "$SQLCMD" \
              -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 30 -b \
              -d "$DB" -i "/tmp/${DB}-seed.sql"; then
              echo "::error::seeding $DB failed"
              exit 1
            fi
            echo "::endgroup::"
          done

      # Assert, don't just print. These previously selected counts without
      # checking them, so they would have stayed green against an empty
      # database once seeding moved out of the dacpac.
      - name: Verify seed data landed
        run: |
          set -euo pipefail
          assert_rows() {
            local db="$1" table="$2" count
            count=$(docker exec mssql "$SQLCMD" \
              -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 15 -h-1 -W -b \
              -d "$db" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM $table;" \
              | tr -d '[:space:]')
            if ! printf '%s' "$count" | grep -qE '^[0-9]+$'; then
              echo "::error::could not read count for $db.$table (got '$count')"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              echo "::error::$db.$table is empty after seeding"
              exit 1
            fi
            echo "  $db.$table = $count"
          }
          assert_rows AdventureWorks "[Production].[Product]"
          assert_rows AdventureWorks "[Sales].[SalesOrderHeader]"
          assert_rows Northwind "[dbo].[Products]"
          assert_rows Northwind "[dbo].[Orders]"

      # Re-running the seed must not duplicate or fail: the deploy job gates
      # on "all tables empty", and the per-table guards are the backstop.
      - name: Verify seed is idempotent
        run: |
          set -euo pipefail
          BEFORE=$(docker exec mssql "$SQLCMD" \
            -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 15 -h-1 -W -b \
            -d AdventureWorks -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [Production].[Product];" | tr -d '[:space:]')
          docker exec mssql "$SQLCMD" \
            -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 30 -b \
            -d AdventureWorks -i /tmp/AdventureWorks-seed.sql
          AFTER=$(docker exec mssql "$SQLCMD" \
            -S localhost -U sa -P "$SA_PASSWORD" -N -C -l 15 -h-1 -W -b \
            -d AdventureWorks -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [Production].[Product];" | tr -d '[:space:]')
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::seed is not idempotent — Product went $BEFORE -> $AFTER on re-run"
            exit 1
          fi
          echo "  re-run left Product at $AFTER"

  docker-build:
    # Build-test for the pod image on every PR. Build only — nothing is
    # pushed to ACR and nothing is deployed; the job exists so a broken
    # Dockerfile / bad build-arg / missing COPY source fails the PR
    # instead of the post-merge deploy.
    #
    # Deliberately self-contained: no Azure login, no ACR. The base
    # image is pulled straight from the upstream GHCR repo
    # (ghcr.io/openclaw/openclaw:<tag>) — the same image deploy.yml
    # mirrors into ACR as openclaw/openclaw-base. The builder layer on
    # top is identical, so a PR that builds here will also build on
    # merge.
    #
    # Also no `environment: dev` — this job needs no secrets, and
    # skipping the environment keeps it out of any protection rules
    # attached to it.
    name: Docker Image Build (no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version pins from /VERSIONS
        id: version
        run: |
          set -euo pipefail
          for key in OPENCLAW_UPSTREAM KUBECTL_VERSION SQLCMD_VERSION; do
            echo "${key}=$(grep "^${key}=" VERSIONS | cut -d= -f2)" >> $GITHUB_OUTPUT
          done
          # GHCR tags drop the leading 'v' (ghcr.io/openclaw/openclaw:2026.7.1,
          # not v2026.7.1) — same transform deploy.yml uses for az acr import.
          UPSTREAM="${{ steps.version.outputs.OPENCLAW_UPSTREAM }}"
          echo "GHCR_TAG=${UPSTREAM#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./builder
          push: false
          load: true
          tags: claw-mock:pr-${{ github.event.pull_request.number }}
          build-args: |
            BASE_IMAGE=ghcr.io/openclaw/openclaw:${{ steps.version.outputs.GHCR_TAG }}
            KUBECTL_VERSION=${{ steps.version.outputs.KUBECTL_VERSION }}
            SQLCMD_VERSION=${{ steps.version.outputs.SQLCMD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
