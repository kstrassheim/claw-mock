name: Apply Secrets

# Renders the claw-mock-secrets Secret from the GitHub Actions
# environment secrets and applies it directly to the AKS cluster. The
# manifest is piped straight from `kubectl create -o yaml` into
# `kubectl apply -f -`, so it never enters git.
#
# The SQL connection secret (claw-mock-db) is NOT handled here — it is
# created by Terraform (main.tf), which owns the bot password's
# lifecycle.
#
# Triggers: on changes to this workflow file, and manually (after the
# user rotated a secret in the GitHub `dev` environment).

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seal-secrets.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  # See validate.yml — public identifiers, auth via OIDC federation.

jobs:
  apply:
    name: Apply claw-mock-secrets to cluster
    runs-on: ubuntu-latest
    environment: dev
    env:
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group claw-mock-dev \
            --name claw-mock-aks \
            --file /tmp/kubeconfig \
            --admin

      - name: Install kubectl
        run: |
          ARCH=$(dpkg --print-architecture)
          mkdir -p "$HOME/.local/bin"
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -sLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply claw-mock-secrets
        env:
          MINIMAX_API_KEY:         ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENTRA_TENANT_ID:         ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_USERNAME:          ${{ secrets.ENTRA_USERNAME }}
          ENTRA_PASSWORD:          ${{ secrets.ENTRA_PASSWORD }}
          ENTRA_TOTP_SEED:         ${{ secrets.ENTRA_TOTP_SEED }}
        run: |
          kubectl create secret generic claw-mock-secrets \
            --namespace claw-mock \
            --dry-run=client \
            --from-literal=MINIMAX_API_KEY="$MINIMAX_API_KEY" \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
            --from-literal=ENTRA_USERNAME="$ENTRA_USERNAME" \
            --from-literal=ENTRA_PASSWORD="$ENTRA_PASSWORD" \
            --from-literal=ENTRA_TOTP_SEED="$ENTRA_TOTP_SEED" \
            -o yaml \
          | kubectl apply -f -
