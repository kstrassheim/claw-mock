---
# ServiceAccount + Role + RoleBinding so the render-config init container
# can patch the claw-mock-config ConfigMap at pod start. Scoped tightly:
# only the claw-mock-config ConfigMap in this namespace, get/patch/update.
#
# The deploy pipeline annotates this SA with
# `azure.workload.identity/client-id: <deploy-claw-mock-dev client id>`
# (value from the terraform `deploy_identity_client_id` output). Together
# with the pod label `azure.workload.identity/use: "true"` below, that
# gives the pod an Entra token for Azure SQL — no SQL password exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claw-mock
  namespace: claw-mock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-mock-config-writer
  namespace: claw-mock
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["claw-mock-config"]
    verbs: ["get", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-mock-config-writer
  namespace: claw-mock
subjects:
  - kind: ServiceAccount
    name: claw-mock
    namespace: claw-mock
roleRef:
  kind: Role
  name: claw-mock-config-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-mock
  namespace: claw-mock
  labels:
    app: claw-mock
    environment: dev
    project: claw-mock
spec:
  replicas: 1
  # `Recreate` (not the default RollingUpdate): terminate the old pod first,
  # then start the new one. With replicas=1 and a RWO claw-mock-workspace
  # PVC, RollingUpdate deadlocks — the new pod can't mount the volume
  # while the old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claw-mock
  template:
    metadata:
      labels:
        app: claw-mock
        # Azure Workload Identity webhook: inject AZURE_CLIENT_ID /
        # AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE into the pod so
        # sqlcmd -G --authentication-method=ActiveDirectoryDefault can
        # reach the Entra-only SQL server.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: claw-mock
      # PVC mounts default to root:root. The openclaw container runs as
      # uid 1000 (node user) and writes config + state into
      # /home/node/.openclaw — so the mounted volume must be
      # group-writable by gid 1000.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
      initContainers:
        # Pre-create subPath/mount parent dirs and fix ownership so the
        # main container (uid 1000) can write into the PVC.
        - name: fix-perms
          image: clwmockdevdev1.azurecr.io/openclaw/claw-mock:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              # Pre-create the dirs the main container's ConfigMap
              # mounts target (workspace/MOCK/, workspace/skills/
              # mocker/). If we don't, kubelet creates them at
              # main-container start as root:root mode 0755 — fsGroup
              # re-chgrps to gid 1000 but doesn't add g+w, and the bot
              # can't write siblings next to them.
              mkdir -p /home/node/.openclaw/workspace/MOCK
              mkdir -p /home/node/.openclaw/workspace/skills/mocker
              chown -R 1000:1000 /home/node/.openclaw
              chmod -R u+rwX,g+rwX /home/node/.openclaw

              # SKILLS LOCKDOWN. Everything above hands the whole state
              # directory to the agent, workspace/skills/ included — so the
              # bot could create a skill directory at runtime and openclaw
              # would load it. A skill is just instructions the agent
              # follows, so one it wrote for itself is the shortest way
              # around every other control here.
              #
              # This MUST run after the recursive chown, not before: the
              # chown would hand the directories straight back and the
              # manifest would still read as though they were locked.
              #
              # Fails CLOSED. If the binary is missing the image is not the
              # one we think it is, and starting anyway would leave the
              # directories writable with nothing reporting it.
              if [ ! -x /usr/local/bin/lock-skill-dirs ]; then
                echo "FATAL: lock-skill-dirs missing from the image — refusing to start" >&2
                exit 1
              fi
              /usr/local/bin/lock-skill-dirs
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw
        # State from before July 2026 has to pass through the upstream bridge
        # release (OPENCLAW_BRIDGE in /VERSIONS) before 2026.10.x opens it:
        # 2026.10 refuses the retired plugin / workspace JSON state outright,
        # and its doctor upgrades the SQLite schemas BEFORE refusing, after
        # which the bridge can no longer open them — migrate-state then loops
        # on the refusal for as long as anyone lets it.
        #
        # Keyed to the shared-state schema, not to a marker file: below what
        # the bridge itself writes, the state predates it; at or above, there
        # is nothing to bridge and this exits at once — every start after the
        # first, and on a fresh PVC (no database at all).
        #
        # BEFORE render-config, deliberately: the bridge reads the config the
        # old release wrote, and render-config then lays the current template
        # over the migrated state.
        - name: bridge-state
          image: clwmockdevdev1.azurecr.io/openclaw/openclaw-base:PLACEHOLDER_BRIDGE_TAG
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              STATE_DB=/home/node/.openclaw/state/openclaw.sqlite
              CFG=/home/node/.openclaw/openclaw.json
              # The shared-state schema the bridge release writes (2026.9.5
              # refuses anything newer than 17). Recheck when OPENCLAW_BRIDGE
              # moves.
              BRIDGE_SCHEMA=17
              if [ ! -f "$STATE_DB" ] || [ ! -f "$CFG" ]; then
                echo "no openclaw state on the PVC - nothing to bridge"
                exit 0
              fi
              V=$(node -e '
                const { DatabaseSync } = require("node:sqlite");
                const db = new DatabaseSync(process.argv[1], { readOnly: true });
                console.log(db.prepare("PRAGMA user_version").get().user_version);
              ' "$STATE_DB")
              if [ "$V" -ge "$BRIDGE_SCHEMA" ]; then
                echo "shared state is at schema $V - already past the bridge"
                exit 0
              fi
              echo "shared state is at schema $V (< $BRIDGE_SCHEMA) - bridging with $(node /app/openclaw.mjs --version)"
              node /app/openclaw.mjs doctor --fix --non-interactive
          envFrom:
            - configMapRef:
                name: claw-mock-config
            - secretRef:
                name: claw-mock-secrets
            - secretRef:
                name: claw-mock-db
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw
            - name: tools-md
              mountPath: /home/node/.openclaw/workspace/TOOLS.md
              subPath: TOOLS.md
            - name: mocking-manuals
              mountPath: /home/node/.openclaw/workspace/MOCK
            - name: skill-mocker
              mountPath: /home/node/.openclaw/workspace/skills/mocker/SKILL.md
              subPath: SKILL.md
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 2Gi
        # Renders the openclaw.json from the template ConfigMap into the
        # PVC (fails fast if MINIMAX_API_KEY is missing — MiniMax is the
        # only provider) and mirrors it into the claw-mock-config
        # ConfigMap for debugging.
        - name: render-config
          image: clwmockdevdev1.azurecr.io/openclaw/claw-mock:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "/scripts/render-config.sh"]
          env:
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-mock-secrets
                  key: MINIMAX_API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: render-scripts
              mountPath: /scripts
            - name: workspace
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Upstream releases can require a state-DB / session-store migration
        # (v2026.10.x refuses to start with "state database schema migration
        # required (audit-events-v2)" and exits 78), so run the safe,
        # non-interactive doctor repairs on every start. A no-op when nothing
        # is pending. After render-config, so it sees the config the gateway
        # will run with; with the main container's env and mounts, because
        # doctor persists enabled:false for any skill whose key it cannot see.
        - name: migrate-state
          image: clwmockdevdev1.azurecr.io/openclaw/claw-mock:latest
          imagePullPolicy: Always
          command: ["node", "/app/openclaw.mjs", "doctor", "--fix", "--non-interactive"]
          envFrom:
            - configMapRef:
                name: claw-mock-config
            - secretRef:
                name: claw-mock-secrets
            - secretRef:
                name: claw-mock-db
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw
            - name: tools-md
              mountPath: /home/node/.openclaw/workspace/TOOLS.md
              subPath: TOOLS.md
            - name: mocking-manuals
              mountPath: /home/node/.openclaw/workspace/MOCK
            - name: skill-mocker
              mountPath: /home/node/.openclaw/workspace/skills/mocker/SKILL.md
              subPath: SKILL.md
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 2Gi
      containers:
        - name: claw-mock
          image: clwmockdevdev1.azurecr.io/openclaw/claw-mock:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              name: web
            - containerPort: 18790
              name: bridge
          envFrom:
            - configMapRef:
                name: claw-mock-config
            # API keys + Entra credentials, applied by the
            # seal-secrets workflow (ENTRA_*, MINIMAX_API_KEY,
            # TELEGRAM_BOT_TOKEN).
            - secretRef:
                name: claw-mock-secrets
            # SQL connection info, created by Terraform
            # (SQL_SERVER_FQDN, SQL_DB_ADVENTUREWORKS, SQL_DB_NORTHWIND —
            # no credentials: auth is Entra workload identity).
            - secretRef:
                name: claw-mock-db
          volumeMounts:
            # Mount the PVC at the WHOLE openclaw state directory —
            # openclaw.json, identity/, sessions/, logs/ all persist
            # across pod restarts (otherwise Telegram re-pairs on
            # every restart).
            - name: workspace
              mountPath: /home/node/.openclaw
            - name: tools-md
              mountPath: /home/node/.openclaw/workspace/TOOLS.md
              subPath: TOOLS.md
            # Mocking manuals, read by the bot at the start of every
            # hourly mock run. ConfigMap content is generated at deploy
            # time from the MOCK-*.md files in the repo root.
            - name: mocking-manuals
              mountPath: /home/node/.openclaw/workspace/MOCK
            # `mocker` chat skill — toggle / inspect the hourly
            # db-mocker CronJob from chat. Pod restart required to pick
            # up ConfigMap edits.
            - name: skill-mocker
              mountPath: /home/node/.openclaw/workspace/skills/mocker/SKILL.md
              subPath: SKILL.md
          resources:
            # Node is Standard_D2pds_v5 (2 vCPU, 8 Gi). Requests
            # guarantee a baseline; limits give burst headroom for mock
            # runs (sqlcmd batches, LLM streaming).
            requests:
              cpu: 600m
              memory: 1500Mi
            limits:
              cpu: 1700m
              memory: 5632Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: claw-mock-workspace
        - name: tools-md
          configMap:
            name: claw-mock-tools-md
        - name: mocking-manuals
          configMap:
            name: claw-mock-mocking-manuals
        - name: skill-mocker
          configMap:
            name: claw-mock-skill-mocker
        - name: config-template
          configMap:
            name: claw-mock-config-template
        - name: render-scripts
          configMap:
            name: claw-mock-render-scripts
            defaultMode: 0755
